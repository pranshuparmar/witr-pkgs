name: Winget Auto Update

on:
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-latest

    steps:
      - name: Install wingetcreate
        shell: powershell
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe"
          $dest = "$env:USERPROFILE\wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest
          echo "$env:USERPROFILE" >> $env:GITHUB_PATH

      - name: Fetch latest witr release
        id: release
        shell: powershell
        run: |
          $repo = "pranshuparmar/witr"
          $url = "https://api.github.com/repos/$repo/releases/latest"

          $headers = @{ "Accept" = "application/vnd.github+json" }
          $response = Invoke-RestMethod -Uri $url -Headers $headers

          $tag = $response.tag_name
          if ($tag.StartsWith("v")) {
            $version = $tag.Substring(1)
          } else {
            $version = $tag
          }

          Write-Host "Latest version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Submit to winget (x64 + arm64)
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_PAT }}
        shell: powershell
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "WINGET_PAT secret is missing"
            exit 1
          }

          $version = "${{ steps.release.outputs.version }}"

          wingetcreate submit `
            --package-id PranshuParmar.witr `
            --version $version `
            --installer https://github.com/pranshuparmar/witr/releases/download/v$version/witr-windows-amd64.zip `
            --installer https://github.com/pranshuparmar/witr/releases/download/v$version/witr-windows-arm64.zip `
            --token $env:WINGET_TOKEN
